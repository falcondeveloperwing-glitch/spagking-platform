[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next.js handles its own routing — no redirects needed.
# The app is a single-route SPA (all views managed client-side via Zustand).
