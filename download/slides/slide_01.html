<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpagKing — Cover</title>
  <link rel="stylesheet" href="global.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { margin: 0; background: #050505; }
    .slide-cover {
      width: 1280px; height: 720px; position: relative; overflow: hidden;
      background: #050505; color: #FAFAFA; font-family: 'Inter', sans-serif;
    }
    .orb-tl {
      position: absolute; top: -220px; left: -220px; width: 640px; height: 640px;
      background: radial-gradient(circle, rgba(255,215,0,0.22), transparent 65%);
      border-radius: 50%; pointer-events: none;
    }
    .orb-br {
      position: absolute; bottom: -240px; right: -240px; width: 680px; height: 680px;
      background: radial-gradient(circle, rgba(255,215,0,0.16), transparent 65%);
      border-radius: 50%; pointer-events: none;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF099 0%, #FFD700 50%, #D4A017 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .gold-emblem {
      width: 92px; height: 92px; border-radius: 50%;
      background: linear-gradient(135deg, #FFF099, #FFD700 50%, #D4A017);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 60px rgba(255,215,0,0.45), 0 0 16px rgba(255,215,0,0.30);
      font-size: 46px;
    }
    .accent-bar-thin {
      width: 48px; height: 4px;
      background: linear-gradient(90deg, #FFD700, #D4A017); border-radius: 2px;
    }
    .corner-mark {
      position: absolute; top: 28px; left: 32px;
      font-size: 11px; color: #5a5a5a; letter-spacing: 0.18em;
      font-family: 'Inter', sans-serif;
    }
    .slide-num-c {
      position: absolute; bottom: 24px; right: 32px;
      font-size: 11px; color: #8A8A8A; font-family: 'Inter', sans-serif;
    }
    .ring-decor {
      position: absolute; border-radius: 50%; border: 1px solid rgba(255,215,0,0.06);
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="slide-cover">
  <div class="orb-tl" data-decor></div>
  <div class="orb-br" data-decor></div>
  <div class="ring-decor" data-decor style="top:-260px; left:-260px; width:760px; height:760px;"></div>
  <div class="ring-decor" data-decor style="bottom:-300px; right:-300px; width:880px; height:880px;"></div>
  <div class="corner-mark">SPAGKING • TECHNOLOGY PLATFORM</div>
  <div class="content-layer w-full h-full flex flex-col items-center justify-center" style="padding: 64px 72px;">
    <div class="gold-emblem mb-7">👑</div>
    <div class="accent-bar-thin mb-5"></div>
    <h1 class="gold-gradient-text" style="font-family:'Poppins',sans-serif; font-weight:800; font-size:56px; line-height:1; letter-spacing:-0.01em;">SpagKing</h1>
    <p class="mt-6 text-center" style="font-family:'Inter',sans-serif; font-weight:400; font-size:22px; color:#FFFFFF;">Restaurant Technology &amp; Management Platform</p>
    <p class="mt-3 text-center" style="font-family:'Inter',sans-serif; font-weight:400; font-size:16px; color:#8A8A8A;">Customer Experience • Operations • Intelligence</p>
    <div class="mt-16 text-center">
      <p style="font-family:'Inter',sans-serif; font-weight:500; font-size:14px; color:#8A8A8A;">Prepared by Falcon Developer</p>
      <p class="mt-1" style="font-family:'Inter',sans-serif; font-weight:400; font-size:14px; color:#FFD700;">Monday, 10 August 2026</p>
    </div>
  </div>
  <div class="slide-num-c">01</div>
</div>
</body>
</html>
