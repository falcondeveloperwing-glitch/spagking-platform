<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Executive Dashboard — SpagKing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  .kpi-card {
    background: linear-gradient(135deg, rgba(255,215,0,0.10) 0%, rgba(255,215,0,0.02) 60%, rgba(255,215,0,0) 100%);
    border: 1px solid rgba(255,215,0,0.18);
    border-radius: 16px;
    padding: 16px 14px;
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    min-height: 108px;
    position:relative;
    overflow:hidden;
  }
  .kpi-card::after {
    content:''; position:absolute; top:0; right:0; width:60px; height:60px;
    background: radial-gradient(circle at top right, rgba(255,215,0,0.18), transparent 70%);
    pointer-events:none;
  }
  .kpi-value {
    font-family:'Poppins',sans-serif; font-weight:700; font-size:24px; line-height:1.05;
    background: linear-gradient(135deg, #FFF099 0%, #FFD700 50%, #D4A017 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    letter-spacing:-0.01em;
  }
  .kpi-label { font-family:'Inter',sans-serif; font-weight:500; font-size:11px; color:#8A8A8A; margin-top:6px; line-height:1.3; }
</style>
</head>
<body class="bg-black">
<div class="slide slide-pad">
  <!-- Decorative glow -->
  <div data-decor aria-hidden="true" class="glow-orb" style="width:420px;height:420px;background:rgba(255,215,0,0.10);top:-180px;right:-140px;"></div>
  <div data-decor aria-hidden="true" class="glow-orb" style="width:320px;height:320px;background:rgba(255,215,0,0.05);bottom:-140px;left:-100px;"></div>

  <div class="content-layer">
    <!-- Header -->
    <div class="flex items-center justify-between mb-1">
      <div>
        <div class="flex items-center gap-3 mb-3">
          <div class="accent-bar"></div>
          <span style="font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;color:#FFD700;letter-spacing:0.15em;">EXECUTIVE DASHBOARD</span>
        </div>
        <h1 style="font-family:'Poppins',sans-serif;font-weight:700;font-size:28px;color:#FAFAFA;line-height:1.15;">Executive Dashboard</h1>
        <p style="font-family:'Inter',sans-serif;font-weight:400;font-size:14px;color:#8A8A8A;margin-top:4px;">The CEO's command center</p>
      </div>
      <div class="logo-mark">👑</div>
    </div>

    <!-- 5x2 KPI grid -->
    <div class="grid grid-cols-5 gap-3 mt-7">
      <div class="kpi-card">
        <div class="kpi-value">₦1.85M</div>
        <div class="kpi-label">Today's Sales</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value">+12.4%</div>
        <div class="kpi-label">vs Yesterday</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value">28.4%</div>
        <div class="kpi-label">Food Cost</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value">22.1%</div>
        <div class="kpi-label">Labour Cost</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value">187</div>
        <div class="kpi-label">Orders</div>
      </div>

      <div class="kpi-card">
        <div class="kpi-value">₦9,866</div>
        <div class="kpi-label">Avg Order Value</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value">4.8★</div>
        <div class="kpi-label">Satisfaction</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value">5</div>
        <div class="kpi-label">Stock Alerts</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value">#1 VI</div>
        <div class="kpi-label">Branch Ranking</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value">247</div>
        <div class="kpi-label">Customers Today</div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="flex items-center gap-3 mt-7">
      <div class="accent-bar"></div>
      <span style="font-family:'Inter',sans-serif;font-weight:400;font-size:14px;color:#FFD700;">Real-time. Every branch. Every metric.</span>
    </div>
  </div>

  <div class="slide-num">13</div>
</div>
</body>
</html>
