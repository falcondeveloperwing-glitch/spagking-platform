<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 24 — Closing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
  body { margin: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .crown-emblem {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFF099 0%, #FFD700 50%, #D4A017 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 0 8px rgba(255,215,0,0.08), 0 0 40px rgba(255,215,0,0.25);
    margin: 0 auto;
  }
  .ghost-mark {
    position: absolute;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 380px;
    color: rgba(255,215,0,0.025);
    letter-spacing: -0.04em;
    line-height: 0.85;
    user-select: none;
    pointer-events: none;
    z-index: 0;
  }
  .corner-tick {
    position: absolute;
    width: 32px;
    height: 32px;
    border: 1px solid rgba(255,215,0,0.25);
  }
</style>
</head>
<body>
<section class="slide slide-pad" style="display:flex;align-items:center;justify-content:center;">

  <!-- Decorative glow orbs -->
  <div data-decor aria-hidden="true" class="glow-orb" style="width:420px;height:420px;background:#FFD700;opacity:0.12;top:-160px;left:-140px;"></div>
  <div data-decor aria-hidden="true" class="glow-orb" style="width:380px;height:380px;background:#D4A017;opacity:0.10;bottom:-140px;right:-120px;"></div>
  <div data-decor aria-hidden="true" class="glow-orb" style="width:260px;height:260px;background:#FFD700;opacity:0.06;top:50%;left:50%;transform:translate(-50%,-50%);"></div>

  <!-- Ghost numeral -->
  <div data-decor aria-hidden="true" class="ghost-mark" style="bottom:-90px;left:30px;">24</div>

  <!-- Corner ticks -->
  <div data-decor aria-hidden="true" class="corner-tick" style="top:40px;left:40px;border-right:none;border-bottom:none;"></div>
  <div data-decor aria-hidden="true" class="corner-tick" style="top:40px;right:40px;border-left:none;border-bottom:none;"></div>
  <div data-decor aria-hidden="true" class="corner-tick" style="bottom:40px;left:40px;border-right:none;border-top:none;"></div>
  <div data-decor aria-hidden="true" class="corner-tick" style="bottom:40px;right:40px;border-left:none;border-top:none;"></div>

  <div class="content-layer w-full flex flex-col items-center text-center" style="max-width: 980px;">

    <!-- Top crown emblem -->
    <div class="crown-emblem">👑</div>

    <!-- Headline (gold gradient) -->
    <h1 class="gold-text" style="font-family:'Poppins',sans-serif;font-weight:700;font-size:42px;line-height:1.18;letter-spacing:-0.01em;margin-top:32px;">
      One platform. Every order.<br>Every branch. Every decision.
    </h1>

    <!-- Subtitle -->
    <p style="font-family:'Inter',sans-serif;font-weight:400;font-size:18px;color:#8A8A8A;line-height:1.45;margin-top:20px;">
      SpagKing Restaurant Technology Platform
    </p>

    <!-- Accent bar -->
    <div style="width:64px;height:4px;background:linear-gradient(90deg,#FFF099,#FFD700,#D4A017);border-radius:2px;margin-top:48px;"></div>

    <!-- Thank you -->
    <p style="font-family:'Poppins',sans-serif;font-weight:600;font-size:20px;color:#FAFAFA;margin-top:18px;letter-spacing:0.01em;">
      Thank you.
    </p>

  </div>

  <span class="slide-num">24 / 24</span>
</section>
</body>
</html>
