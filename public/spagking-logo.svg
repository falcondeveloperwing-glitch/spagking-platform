<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#A87A0E"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Crown -->
  <g filter="url(#glow)">
    <path d="M30 38 L42 50 L60 30 L78 50 L90 38 L86 64 L34 64 Z" fill="url(#goldGrad)" stroke="#FFE9A8" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="30" cy="36" r="4" fill="url(#goldShine)"/>
    <circle cx="60" cy="28" r="4.5" fill="url(#goldShine)"/>
    <circle cx="90" cy="36" r="4" fill="url(#goldShine)"/>
  </g>
  <!-- Spaghetti strands swoosh -->
  <g stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M28 78 Q60 70 92 82"/>
    <path d="M28 86 Q60 78 92 90"/>
    <path d="M28 94 Q60 86 92 98"/>
  </g>
  <!-- SK monogram hint (fork accent) -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="60" y1="68" x2="60" y2="74"/>
  </g>
</svg>
