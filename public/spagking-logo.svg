<svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE9B0"/>
      <stop offset="45%" stop-color="#E8B84A"/>
      <stop offset="100%" stop-color="#9C7416"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D780"/>
      <stop offset="100%" stop-color="#B8901E"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FCE9B0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCE9B0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B84A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8B84A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Soft ambient glow -->
  <circle cx="70" cy="72" r="60" fill="url(#glowGrad)"/>

  <!-- Steam (3 wisps rising from the bowl) -->
  <g opacity="0.85">
    <path d="M 56 60 Q 52 50 56 42 Q 60 34 56 26" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 70 58 Q 66 48 70 40 Q 74 30 70 22" stroke="url(#steamGrad)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M 84 60 Q 80 50 84 42 Q 88 34 84 26" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Crown (above the bowl) -->
  <g filter="url(#softShadow)">
    <!-- Crown base band -->
    <rect x="44" y="58" width="52" height="6" rx="2" fill="url(#crownGrad)"/>
    <!-- Crown peaks -->
    <path d="M 44 58 L 52 42 L 60 54 L 70 38 L 80 54 L 88 42 L 96 58 Z" fill="url(#crownGrad)" stroke="#FFE9A8" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Crown jewels -->
    <circle cx="52" cy="40" r="2.8" fill="#FFE9A8"/>
    <circle cx="70" cy="36" r="3.4" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="88" cy="40" r="2.8" fill="#FFE9A8"/>
    <!-- Crown center accent -->
    <circle cx="70" cy="50" r="2" fill="#0B0B0B" opacity="0.3"/>
  </g>

  <!-- Bowl (the spaghetti bowl) -->
  <g filter="url(#softShadow)">
    <!-- Bowl rim (ellipse) -->
    <ellipse cx="70" cy="74" rx="38" ry="7" fill="url(#bowlGrad)"/>
    <!-- Bowl body -->
    <path d="M 32 74 Q 32 100 70 104 Q 108 100 108 74 Z" fill="url(#bowlGrad)"/>
    <!-- Bowl rim highlight -->
    <ellipse cx="70" cy="74" rx="38" ry="7" fill="none" stroke="#FFE9A8" stroke-width="1" opacity="0.6"/>
    <!-- Inner bowl shadow -->
    <ellipse cx="70" cy="75" rx="32" ry="5" fill="#0B0B0B" opacity="0.25"/>
    <!-- Spaghetti strands inside bowl -->
    <g stroke="#FCE9B0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M 44 76 Q 55 73 66 76 Q 77 79 88 76"/>
      <path d="M 46 80 Q 58 77 70 80 Q 82 83 92 80"/>
      <path d="M 48 84 Q 60 81 72 84 Q 84 87 94 84"/>
    </g>
  </g>

  <!-- Subtle gold dot accents (brand sparkle) -->
  <circle cx="30" cy="100" r="1.5" fill="#E8B84A" opacity="0.5"/>
  <circle cx="110" cy="100" r="1.5" fill="#E8B84A" opacity="0.5"/>
</svg>
