<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bowlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft ambient glow behind emblem -->
  <circle cx="100" cy="100" r="95" fill="url(#bowlGlow)"/>

  <!-- Outer ring (thicker) -->
  <circle cx="100" cy="100" r="92" stroke="#FFD700" stroke-width="2.5" fill="none" opacity="0.95" filter="url(#neonGlow)"/>
  <!-- Inner ring (thinner, creates double-ring effect) -->
  <circle cx="100" cy="100" r="84" stroke="#FFD700" stroke-width="1.2" fill="none" opacity="0.85" filter="url(#neonGlow)"/>

  <g filter="url(#neonGlow)">
    <!-- ラーメン (Ramen) katakana text at ~2 o'clock -->
    <text x="135" y="48" fill="#FFD700" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">ラーメン</text>

    <!-- Ramen bowl (top tier) — viewed slight angle, with rim -->
    <!-- Bowl body -->
    <path d="M 62 78 Q 62 102 100 106 Q 138 102 138 78 Z" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Bowl rim (ellipse) -->
    <ellipse cx="100" cy="78" rx="38" ry="6" fill="none" stroke="#FFD700" stroke-width="2.5"/>
    <!-- Noodle/content lines inside bowl -->
    <path d="M 72 82 Q 82 79 92 82" stroke="#FFD700" stroke-width="1.3" fill="none" opacity="0.85" stroke-linecap="round"/>
    <path d="M 90 84 Q 100 81 110 84" stroke="#FFD700" stroke-width="1.3" fill="none" opacity="0.85" stroke-linecap="round"/>
    <path d="M 108 82 Q 118 79 128 82" stroke="#FFD700" stroke-width="1.3" fill="none" opacity="0.85" stroke-linecap="round"/>
    <!-- Steam wisps rising -->
    <path d="M 82 70 Q 78 60 82 52" stroke="#FFD700" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 100 68 Q 96 56 100 46" stroke="#FFD700" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 118 70 Q 114 60 118 52" stroke="#FFD700" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round"/>

    <!-- Chopsticks resting diagonally across the bowl (upper-left to lower-right) -->
    <line x1="58" y1="60" x2="142" y2="92" stroke="#FFD700" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="60" y1="54" x2="144" y2="86" stroke="#FFD700" stroke-width="2.2" stroke-linecap="round"/>

    <!-- SpagKing wordmark (script/brush style) — bottom tier -->
    <text x="100" y="148" text-anchor="middle" fill="#FFD700" font-family="'Pacifico','Brush Script MT',cursive" font-size="26" font-weight="700">SpagKing</text>
  </g>

  <!-- Small brand sparkle dots flanking the wordmark -->
  <circle cx="40" cy="148" r="1.5" fill="#FFD700" opacity="0.6"/>
  <circle cx="160" cy="148" r="1.5" fill="#FFD700" opacity="0.6"/>
</svg>
